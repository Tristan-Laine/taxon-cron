# Nightly prerender rebuild for EVERY game at once: pings each Vercel deploy
# hook so the sites rebuild from their latest commit and the daily pages roll
# over (/answers shows yesterday's solutions, and the sitemap gets a fresh
# <lastmod>).
#
# Replaces the per-repo daily-rebuild.yml that used to live in each DLE. Same
# reasoning as push-hourly.yml: GitHub bills per JOB, so ten repos pinging one
# hook each cost ten times one job pinging ten hooks.
#
# WHEN IT ACTUALLY RUNS
# The crons say 10:13 and 10:43 UTC. From 10:00 UTC every timezone from UTC-10
# eastward has finished yesterday, so the prerendered /answers can never spoil a
# puzzle someone can still play. GitHub honours the schedule loosely: from
# 2026-08-27 to 2026-09-10 the two runs started between 13:27 and 21:14 UTC, and
# only 4 to 20 minutes apart. Late is harmless (still after 10:00, just a few
# hours less fresh). Only a build BEFORE 10:00 UTC could spoil.
#
# ONE REBUILD A DAY, NOT TWO (changed 2026-09-11)
# The second schedule is a safety net for the day GitHub silently drops a run.
# It used to ping every hook regardless, so all ten games were rebuilt twice a
# day: about 300 wasted builds a month, roughly 2.4 $ of Vercel Build CPU.
#
# A scheduled run now first asks the GitHub API whether another run of this
# workflow already SUCCEEDED today after 10:00 UTC, and stops if one did. Both
# runs share the concurrency group below, so the second never starts before the
# first has finished and can always see its result. Whichever schedule fires
# first does the work.
#
# First attempt (2026-09-08, replaced before it ever saved anything): read each
# site's build-info.json and skip the games already rebuilt. With runs minutes
# apart, most Vercel builds queued by the first run were not finished when the
# second looked, so it re-pinged them anyway. The GitHub run history does not
# depend on Vercel's build queue.
#
# Limits, stated plainly:
# - If BOTH schedules are dropped nothing runs, and nothing can report it.
# - A first run with one failed hook ends in failure, so the second run rebuilds
#   all ten. Wasteful but rare, and the safe direction.
# - Any error while querying the API also falls through to rebuilding all ten.
# - workflow_dispatch always rebuilds: firing it by hand means you want it.
#
# A game whose hook fails does NOT stop the others: every hook is attempted,
# then the job fails at the end so the failure still shows up in the Actions tab.
# GitHub runs this script under `bash -e`, hence `|| true` after each curl: one
# site's DNS error or timeout must not end the loop.
#
# Setup: see README.md (secret DEPLOY_HOOKS).

name: Daily prerender rebuild (all games)

on:
  schedule:
    - cron: '13 10 * * *'
    - cron: '43 10 * * *'
  workflow_dispatch:

concurrency:
  group: daily-rebuild
  cancel-in-progress: false

# actions: read lets the job list this workflow's own past runs (see above).
permissions:
  actions: read
  contents: read

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ping every Vercel deploy hook
        env:
          DEPLOY_HOOKS: ${{ secrets.DEPLOY_HOOKS }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail

          if [ -z "${DEPLOY_HOOKS:-}" ]; then
            echo "::error::Missing DEPLOY_HOOKS secret (see README.md)"
            exit 1
          fi
          if ! printf '%s' "$DEPLOY_HOOKS" | jq -e . >/dev/null 2>&1; then
            echo "::error::DEPLOY_HOOKS is not valid JSON (expected an object of id -> hook url)"
            exit 1
          fi

          if [ "$EVENT_NAME" = "schedule" ]; then
            # ISO 8601 UTC timestamps sort lexicographically, so this string
            # comparison IS a date comparison.
            since="$(date -u +%Y-%m-%d)T10:00:00Z"
            done_run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily-rebuild.yml \
                         --status success --limit 20 --json databaseId,createdAt \
                         --jq "[.[] | select(.databaseId != $RUN_ID and .createdAt >= \"$since\")] | first | .databaseId // empty" \
                         2>/dev/null || true)
            if [ -n "$done_run" ]; then
              echo "Already rebuilt today: run $done_run succeeded after $since. Nothing to do."
              exit 0
            fi
            echo "No successful rebuild yet today after $since: rebuilding every game."
          else
            echo "Manual run: rebuilding every game."
          fi

          failed=""
          rebuilt=""

          while read -r id; do
            hook=$(printf '%s' "$DEPLOY_HOOKS" | jq -r --arg id "$id" '.[$id] // empty')
            if [ -z "$hook" ]; then
              echo "::warning::$id has no entry in DEPLOY_HOOKS, skipped"
              continue
            fi
            # A deploy hook URL IS the credential: mask it before curl can echo
            # it back in an error message.
            echo "::add-mask::$hook"

            # Vercel answers 201 + a job object on success, and an explicit error
            # object on failure. Keep the body: without it, a GitHub outage
            # (Vercel cannot fetch the repo, code "incorrect_git_source_info")
            # and a genuinely revoked hook both produce the same silent 400. The
            # body never contains the hook URL, and it is masked anyway.
            resp=$(curl --silent --show-error --max-time 30 \
                     --request POST "$hook" \
                     --write-out '\n%{http_code}' 2>&1 || true)
            code=$(printf '%s' "$resp" | tail -n1)
            payload=$(printf '%s' "$resp" | sed '$d')

            case "$code" in
              2*) echo "ok    $id  HTTP $code"
                  rebuilt="$rebuilt $id" ;;
              *)  echo "::warning::$id: HTTP $code  $payload"
                  failed="$failed $id" ;;
            esac
          done < <(jq -r '.[].id' sites.json)

          echo ""
          echo "Rebuilt:${rebuilt:- none}"

          if [ -n "$failed" ]; then
            echo "::error::deploy hook failed for:$failed"
            exit 1
          fi
          echo "All rebuilds queued."
